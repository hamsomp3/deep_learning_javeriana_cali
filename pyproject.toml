description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jan Polanco V.", email = "hamsomp3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
